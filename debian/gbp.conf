[DEFAULT]
# Packaging lives on the qcom/debian/latest branch; upstream source is merged
# in from the upstream ros2 branch as the second parent of a merge commit.
debian-branch = qcom/debian/latest
upstream-branch = upstream/ros2

# Upstream has no release tags, so upstream snapshots are tagged in the
# upstream/ namespace as upstream/<version> (see debian/watch).
upstream-tag = upstream/%(version)s

# We merge upstream from git rather than importing release tarballs, so there
# is no pristine-tar branch to maintain.
pristine-tar = False

[buildpackage]
# 3.0 (quilt): let gbp build the .orig tarball from the upstream tree.
compression = xz

[import-orig]
merge-mode = merge
